name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JSHint
        run: npm install -g jshint

      - name: Run Linter
        run: |
          jshint --exclude node_modules giftlink-backend/routes/*.js giftlink-backend/models/*.js sentiment/*.js app.js db.js giftRoutes.js searchRoutes.js authRoutes.js

      - name: Complete job
        run: echo "All steps completed successfully"
